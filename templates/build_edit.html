<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Build</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>PC Inventory</h2>
        <div class="nav-item" onclick="navigateTo('dashboard')">
            <span>📊</span>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="navigateTo('inventory')">
            <span>📦</span>
            <span>Inventory</span>
        </div>
        <div class="nav-item active" onclick="navigateTo('builder')">
            <span>🖥️</span>
            <span>PC Builder</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Edit Build: <span id="buildName">Gaming PC</span></h1>
            <button class="add-button" onclick="navigateTo('builder')">Back to Builds</button>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="progress-text" id="progressText">0 of 8 components</p>
            <p class="progress-subtext">Complete build specs help your listing stand out</p>
        </div>

        <!-- Component Grid -->
        <div class="component-grid" id="componentGrid">
            <!-- Components will be loaded here -->
        </div>

        <!-- Build Summary -->
        <div class="summary-section">
            <h3>Build Summary</h3>
            <div class="summary-row">
                <span>Total Cost:</span>
                <span id="totalCost">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Estimated MSRP:</span>
                <span id="totalMSRP">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Profit Margin:</span>
                <span id="profitMargin">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        // Component categories with icons and descriptions
        const componentCategories = [
            { name: 'GPU', title: 'Graphics Card', icon: '🖥️', placeholder: 'Example: EVGA GeForce RTX 3080 Ti' },
            { name: 'CPU', title: 'Processor', icon: '🔲', placeholder: 'Example: Intel Core i9-13900K' },
            { name: 'Motherboard', title: 'Motherboard', icon: '📟', placeholder: 'Example: ASUS ROG Strix B550-F' },
            { name: 'RAM', title: 'RAM', icon: '🔷', placeholder: 'Example: G.Skill Trident Z 32GB' },
            { name: 'Storage', title: 'Storage', icon: '💾', placeholder: 'Example: Samsung 980 Pro 1TB' },
            { name: 'PSU', title: 'Power Supply', icon: '⚡', placeholder: 'Example: Corsair RM850x' },
            { name: 'Case', title: 'Case', icon: '📦', placeholder: 'Example: NZXT H510' },
            { name: 'CPU Cooler', title: 'CPU Cooler', icon: '❄️', placeholder: 'Example: Noctua NH-D15' }
        ];

        let components = [];
        let buildComponents = {};
        let currentBuild = null;
        let activeDropdown = null;

        // Map UI categories to API categories
        const categoryMap = {
            'CPU Cooler': 'Cooling'
        };

        // Initialize
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const buildId = urlParams.get('id') || 1;
            
            try {
                const [componentsResponse, buildResponse] = await Promise.all([
                    fetch('/api/inventory/components'),
                    fetch(`/api/builder/builds/${buildId}`)
                ]);
                components = await componentsResponse.json();
                currentBuild = await buildResponse.json();
                
                document.getElementById('buildName').textContent = currentBuild.name;
                
                await loadBuildComponents();
                renderComponentCards();
                updateProgress();
                updateSummary();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        async function loadBuildComponents() {
            try {
                const response = await fetch(`/api/builder/builds/${currentBuild.id}/components`);
                const bcData = await response.json();
                
                buildComponents = {};
                bcData.forEach(bc => {
                    const uiCategory = Object.keys(categoryMap).find(key => categoryMap[key] === bc.category) || bc.category;
                    buildComponents[uiCategory] = {
                        componentId: bc.component_id,
                        buildComponentId: bc.id,
                        name: bc.component_name,
                        category: bc.category,
                        cost: bc.cost_at_time,
                        msrp: bc.msrp
                    };
                });
            } catch (error) {
                console.error('Error loading build components:', error);
            }
        }

        function renderComponentCards() {
            const grid = document.getElementById('componentGrid');
            grid.innerHTML = componentCategories.map(category => {
                const selected = buildComponents[category.name];
                const isFilled = !!selected;
                
                return `
                    <div class="component-card ${isFilled ? 'filled' : ''}" data-category="${category.name}">
                        <div class="component-icon">${category.icon}</div>
                        <div class="component-title">${category.title}</div>
                        <div class="component-description">${category.description}</div>
                        ${isFilled ? `
                            <div class="selected-component">
                                <div>
                                    <div class="selected-component-name">${selected.name}</div>
                                    <div class="selected-component-price">$${selected.cost.toFixed(2)}</div>
                                </div>
                            </div>
                            <button class="remove-btn" onclick="removeComponent('${category.name}')">Remove</button>
                        ` : `
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    class="component-input" 
                                    placeholder="${category.placeholder}"
                                    oninput="filterComponents('${category.name}', this.value)"
                                    onfocus="showDropdown('${category.name}', this)"
                                    onblur="hideDropdown('${category.name}')"
                                />
                                <div id="dropdown-${category.name}" class="dropdown-list" style="display: none;"></div>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        function showDropdown(category, input) {
            activeDropdown = category;
            filterComponents(category, input.value);
        }

        function hideDropdown(category) {
            setTimeout(() => {
                const dropdown = document.getElementById(`dropdown-${category}`);
                if (dropdown) dropdown.style.display = 'none';
                activeDropdown = null;
            }, 200);
        }

        function filterComponents(category, searchTerm) {
            const dropdown = document.getElementById(`dropdown-${category}`);
            if (!dropdown) return;

            const mappedCategory = categoryMap[category] || category;

            const filtered = components.filter(c => 
                c.category === mappedCategory && 
                c.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (filtered.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            dropdown.innerHTML = filtered.map(c => `
                <div class="dropdown-item" onmousedown="selectComponent('${category}', ${c.id})">
                    <div style="font-weight: 600;">${c.name}</div>
                    <div style="color: #27ae60; font-size: 12px;">$${c.cost.toFixed(2)}</div>
                    <div style="color: #c9c9c9; font-size: 12px;">$${c.msrp.toFixed(2)}</div>
                </div>
            `).join('');
            
            dropdown.style.display = 'block';
        }

        async function selectComponent(category, componentId) {
            const component = components.find(c => c.id === componentId);
            if (!component || !currentBuild) return;
            
            try {
                const response = await fetch(`/api/builder/builds/${currentBuild.id}/components`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ component_id: componentId, quantity: 1, cost_at_time: component.cost, })
                });
                
                if (response.ok) {
                    await loadBuildComponents();
                    renderComponentCards();
                    updateProgress();
                    updateSummary();
                }
            } catch (error) {
                console.error('Error adding component:', error);
            }
        }

        async function removeComponent(category) {
            const bc = buildComponents[category];
            if (!bc || !currentBuild) return;
            
            try {
                const response = await fetch(`/api/builder/builds/${currentBuild.id}/components/${bc.buildComponentId}`, {
                    method: 'PUT'
                });
                
                if (response.ok) {
                    await loadBuildComponents();
                    renderComponentCards();
                    updateProgress();
                    updateSummary();
                }
            } catch (error) {
                console.error('Error removing component:', error);
            }
        }

        function updateProgress() {
            const filled = Object.keys(buildComponents).length;
            const total = componentCategories.length;
            const percentage = (filled / total) * 100;
            
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressText').textContent = `${filled} of ${total} components`;
        }

        function updateSummary() {
            const totalCost = Object.values(buildComponents).reduce((sum, c) => sum + c.cost, 0);
            const totalMSRP = Object.values(buildComponents).reduce((sum, c) => sum + c.msrp, 0);
            const profit = totalMSRP - totalCost;
            
            document.getElementById('totalCost').textContent = `$${totalCost.toFixed(2)}`;
            document.getElementById('totalMSRP').textContent = `$${totalMSRP.toFixed(2)}`;
            document.getElementById('profitMargin').textContent = `$${profit.toFixed(2)}`;
        }

        function navigateTo(page) {
            console.log('Navigate to:', page);
            // window.location.href = `/${page}`;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
