<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Inventory Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            padding: 0 20px 30px 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid #34495e;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background-color: #34495e;
        }

        .nav-item.active {
            background-color: #3498db;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: #2c3e50;
        }

        .add-button {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .add-button:hover {
            background-color: #2980b9;
        }

        /* Search and Filter Bar */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .filter-select {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background-color: white;
            cursor: pointer;
        }

        /* Inventory Table */
        .inventory-table {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #34495e;
            color: white;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #ecf0f1;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        td {
            padding: 16px;
            color: #2c3e50;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-cpu { background-color: #e3f2fd; color: #1976d2; }
        .badge-gpu { background-color: #f3e5f5; color: #7b1fa2; }
        .badge-motherboard { background-color: #e8f5e9; color: #388e3c; }
        .badge-ram { background-color: #fff3e0; color: #f57c00; }
        .badge-storage { background-color: #fce4ec; color: #c2185b; }
        .badge-psu { background-color: #e0f2f1; color: #00796b; }
        .badge-case { background-color: #f1f8e9; color: #689f38; }
        .badge-cooling { background-color: #e1f5fe; color: #0288d1; }
        .badge-extras { background-color: #ede7f6; color: #5e35b1; }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .edit-btn {
            background-color: #3498db;
            color: white;
        }

        .edit-btn:hover {
            background-color: #2980b9;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        /* Modal for Add/Edit Component */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: #2c3e50;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .submit-btn {
            background-color: #27ae60;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        .submit-btn:hover {
            background-color: #229954;
        }

        .cancel-btn {
            background-color: #95a5a6;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .cancel-btn:hover {
            background-color: #7f8c8d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>PC Inventory</h2>
        <div class="nav-item" onclick="navigateTo('dashboard')">
            <span>📊</span>
            <span>Dashboard</span>
        </div>
        <div class="nav-item active" onclick="navigateTo('inventory')">
            <span>📦</span>
            <span>Inventory</span>
        </div>
        <div class="nav-item" onclick="navigateTo('builder')">
            <span>🖥️</span>
            <span>PC Builder</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Inventory Management</h1>
            <button class="add-button" onclick="openModal()">+ Add Component</button>
        </div>

        <!-- Search and Filter Controls -->
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="Search by name..." onkeyup="filterTable()">
            <select class="filter-select" id="categoryFilter" onchange="filterTable()">
                <option value="">All Categories</option>
                <option value="CPU">CPU</option>
                <option value="GPU">GPU</option>
                <option value="Motherboard">Motherboard</option>
                <option value="RAM">RAM</option>
                <option value="Storage">Storage</option>
                <option value="PSU">PSU</option>
                <option value="Case">Case</option>
                <option value="Cooling">Cooling</option>
                <option value="Extras">Extras</option>
            </select>
        </div>

        <!-- Inventory Table -->
        <div class="inventory-table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Cost</th>
                        <th>MSRP</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Component Modal -->
    <div class="modal" id="componentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Component</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="form-group">
                <label>Component Name</label>
                <input type="text" id="componentName" placeholder="e.g., RTX 3070 Ti">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="componentCategory">
                    <option value="">Select Category</option>
                    <option value="CPU">CPU</option>
                    <option value="GPU">GPU</option>
                    <option value="Motherboard">Motherboard</option>
                    <option value="RAM">RAM</option>
                    <option value="Storage">Storage</option>
                    <option value="PSU">PSU</option>
                    <option value="Case">Case</option>
                    <option value="Cooling">Cooling</option>
                    <option value="Extras">Extras</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cost per Unit ($)</label>
                <input type="number" id="componentCost" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>MSRP ($)</label>
                <input type="number" id="componentMSRP" step="0.01" placeholder="0.00">
            </div>
            <div class="form-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="submit-btn" onclick="saveComponent()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let components = [];
        let editingId = null;

        // Load components from API
        async function loadComponents() {
            try {
                const response = await fetch('/components');
                components = await response.json();
                renderTable();
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        // Render table
        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');
            
            if (components.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><h3>No components yet</h3><p>Click "Add Component" to get started</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = components.map(component => `
                <tr>
                    <td><strong>${component.name}</strong></td>
                    <td><span class="category-badge badge-${component.category.toLowerCase()}">${component.category}</span></td>
                    <td>$${component.cost.toFixed(2)}</td>
                    <td>$${component.msrp ? component.msrp.toFixed(2) : 'N/A'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn edit-btn" onclick="editComponent(${component.id})">Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteComponent(${component.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Filter table
        function filterTable() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;

            const filtered = components.filter(component => {
                const matchesSearch = component.name.toLowerCase().includes(searchTerm);
                const matchesCategory = !categoryFilter || component.category === categoryFilter;
                return matchesSearch && matchesCategory;
            });

            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = filtered.map(component => `
                <tr>
                    <td><strong>${component.name}</strong></td>
                    <td><span class="category-badge badge-${component.category.toLowerCase()}">${component.category}</span></td>
                    <td>$${component.cost.toFixed(2)}</td>
                    <td>$${component.msrp ? component.msrp.toFixed(2) : 'N/A'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn edit-btn" onclick="editComponent(${component.id})">Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteComponent(${component.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Modal functions
        function openModal() {
            document.getElementById('modalTitle').textContent = 'Add Component';
            document.getElementById('componentName').value = '';
            document.getElementById('componentCategory').value = '';
            document.getElementById('componentCost').value = '';
            document.getElementById('componentMSRP').value = '';
            editingId = null;
            document.getElementById('componentModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('componentModal').classList.remove('active');
        }

        function editComponent(id) {
            const component = components.find(c => c.id === id);
            if (!component) return;

            document.getElementById('modalTitle').textContent = 'Edit Component';
            document.getElementById('componentName').value = component.name;
            document.getElementById('componentCategory').value = component.category;
            document.getElementById('componentCost').value = component.cost;
            document.getElementById('componentMSRP').value = component.msrp || '';
            editingId = id;
            document.getElementById('componentModal').classList.add('active');
        }

        async function saveComponent() {
            const name = document.getElementById('componentName').value;
            const category = document.getElementById('componentCategory').value;
            const cost = parseFloat(document.getElementById('componentCost').value);
            const msrp = parseFloat(document.getElementById('componentMSRP').value) || null;

            if (!name || !category || !cost) {
                alert('Please fill in all required fields');
                return;
            }

            // TODO: Implement API call to save component
            console.log('Saving component:', { name, category, cost, msrp, editingId });
            
            // For now, just update locally
            if (editingId) {
                const index = components.findIndex(c => c.id === editingId);
                components[index] = { id: editingId, name, category, cost, msrp };
            } else {
                const newId = Math.max(...components.map(c => c.id), 0) + 1;
                components.push({ id: newId, name, category, cost, msrp });
            }

            renderTable();
            closeModal();
        }

        async function deleteComponent(id) {
            if (!confirm('Are you sure you want to delete this component?')) return;

            // TODO: Implement API call to delete component
            components = components.filter(c => c.id !== id);
            renderTable();
        }

        function navigateTo(page) {
            console.log('Navigate to:', page);
            // TODO: Implement navigation
            alert(`Navigation to ${page} - Coming soon!`);
        }

        // Load components on page load
        loadComponents();
    </script>
</body>
</html>
