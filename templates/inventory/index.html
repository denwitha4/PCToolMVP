{% extends "base.html" %}

{% block title %}Inventory Management{% endblock %}

{% block content %}
<div class="main-content">
    <div class="header">
        <h1>Inventory Management</h1>
        <button class="add-button" onclick="openModal()">+ Add Component</button>
    </div>

    <!-- Search and Filter Controls -->
    <div class="controls">
        <input type="text" class="search-box" id="searchBox" placeholder="Search by name..." onkeyup="filterTable()">
        <select class="filter-select" id="categoryFilter" onchange="filterTable()">
            <option value="">All Categories</option>
            <option value="CPU">CPU</option>
            <option value="GPU">GPU</option>
            <option value="Motherboard">Motherboard</option>
            <option value="RAM">RAM</option>
            <option value="Storage">Storage</option>
            <option value="PSU">PSU</option>
            <option value="Case">Case</option>
            <option value="Cooling">Cooling</option>
            <option value="Extras">Extras</option>
        </select>
    </div>

    <!-- Inventory Table -->
    <div class="inventory-table">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Cost</th>
                    <th>MSRP</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Include the modal component -->
{% include 'components/component_modal.html' %}
{% endblock %}

{% block extra_js %}
<script src="/static/js/component-modal.js"></script>
<script>
    let components = [];
    let editingId = null;

    // Load components from API
    async function loadComponents() {
        try {
            const response = await fetch('/api/inventory/components');
            components = await response.json();
            renderTable();
        } catch (error) {
            console.error('Error loading components:', error);
        }
    }

    // Render table
    function renderTable() {
        const tbody = document.getElementById('inventoryTableBody');
        
        if (components.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><h3>No components yet</h3><p>Click "Add Component" to get started</p></div></td></tr>';
            return;
        }

        tbody.innerHTML = components.map(component => `
            <tr>
                <td><strong>${component.name}</strong></td>
                <td><span class="category-badge badge-${component.category.toLowerCase()}">${component.category}</span></td>
                <td>$${component.cost.toFixed(2)}</td>
                <td>$${component.msrp ? component.msrp.toFixed(2) : 'N/A'}</td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn edit-btn" onclick="editComponent(${component.id})">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteComponent(${component.id})">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    // Filter table
    function filterTable() {
        const searchTerm = document.getElementById('searchBox').value.toLowerCase();
        const categoryFilter = document.getElementById('categoryFilter').value;

        const filtered = components.filter(component => {
            const matchesSearch = component.name.toLowerCase().includes(searchTerm);
            const matchesCategory = !categoryFilter || component.category === categoryFilter;
            return matchesSearch && matchesCategory;
        });

        const tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = filtered.map(component => `
            <tr>
                <td><strong>${component.name}</strong></td>
                <td><span class="category-badge badge-${component.category.toLowerCase()}">${component.category}</span></td>
                <td>$${component.cost.toFixed(2)}</td>
                <td>$${component.msrp ? component.msrp.toFixed(2) : 'N/A'}</td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn edit-btn" onclick="editComponent(${component.id})">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteComponent(${component.id})">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function navigateTo(page) {
        window.location.href = `/${page}`;
    }

    // Listen for component saved event from modal
    window.addEventListener('componentSaved', () => {
        loadComponents(); // Refresh the table when modal saves
    });

    // Load components on page load
    loadComponents();
</script>
{% endblock %}
