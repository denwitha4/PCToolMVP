<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="index-body">
    <div class="container">
        <h1 class="index-h1">Welcome to My Website</h1>
        <div class="button-group">
            <button class="index-button btn-primary" onclick="handleClick('Button 1')">Button 1</button>
            <button class="index-button btn-secondary" onclick="handleClick('Button 2')">Button 2</button>
        </div>
        <div class="message" id="message"></div>
    </div>
    
    <script>
        function handleClick(buttonName) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = `You clicked ${buttonName}!`;
            if (buttonName === 'Button 1') {
                window.location.href = '/inventory';
                return;
            }
            // Optional: Send data to backend
            fetch('/button-click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ button: buttonName })
            })
            .then(response => response.json())
            .then(data => console.log('Server response:', data))
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
